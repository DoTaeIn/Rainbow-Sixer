<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sixer</title>
<style>
  :root {
    --bg: #0b1120; --panel: #1e293b; --line: #334155;
    --dim: #64748b; --fg: #e2e8f0; --accent: #22d3ee;
  }
  * { box-sizing: border-box; margin: 0; }
  /* 100dvh 라야 모바일 주소창이 접혔다 펴져도 바닥이 잘리지 않는다. */
  body { height: 100vh; height: 100dvh; display: flex; flex-direction: column;
         background: var(--bg); color: var(--fg); overflow: hidden;
         font: 13px/1.45 system-ui, sans-serif; user-select: none;
         -webkit-text-size-adjust: 100%; }
  h2 { font-size: 10px; letter-spacing: .12em; color: var(--dim); font-weight: 700; }
  button { font: inherit; cursor: pointer; }
  [hidden] { display: none !important; }

  /* ── 공통: 헤더 ─────────────────────────── */
  header { flex: none; display: flex; align-items: center; gap: 14px; padding: 10px 16px;
           background: var(--panel); border-bottom: 1px solid var(--line); }
  #logo { font-weight: 800; font-size: 17px; letter-spacing: -.02em; color: var(--accent); }
  #codeval { padding: 5px 11px; border: 1px solid var(--line); border-radius: 4px;
             background: #0f172a; color: inherit; font: 700 13px/1 ui-monospace, monospace;
             letter-spacing: .14em; cursor: pointer; }
  #codeval:hover { color: var(--accent); border-color: var(--accent); }
  #codeval[data-copied] { color: var(--accent); border-color: var(--accent); }
  header button { padding: 6px 11px; border: 1px solid var(--line); border-radius: 5px;
                  background: #0f172a; color: var(--dim); }
  header button:hover { color: var(--fg); border-color: var(--dim); }
  #leave { margin-right: 4px; color: #f87171; border-color: #7f1d1d; }
  #leave:hover { color: #fca5a5; border-color: #f87171; }
  #status { margin-left: auto; color: var(--dim); font-size: 11px; }

  /* ── 화면 0: 입장 ───────────────────────── */
  /* 디스코드 Activity 에서는 방과 닉네임을 디스코드가 주므로 입장 화면이 없다. */
  html[data-host="discord"] #join { display: none; }
  #join { flex: 1; display: grid; place-items: center; padding: 20px; }
  #join form { width: 100%; max-width: 300px; display: flex; flex-direction: column; }
  #join h2 { margin-bottom: 6px; }
  #join label { font-size: 11px; color: var(--dim); margin: 12px 0 5px; }
  #join input { padding: 11px 12px; border: 1px solid var(--line); border-radius: 6px;
                background: #0f172a; color: var(--fg); font: inherit; width: 100%; }
  #join input:focus { outline: none; border-color: var(--accent); }
  #joinCode { font: 700 19px/1 ui-monospace, monospace; letter-spacing: .2em;
              text-align: center; text-transform: uppercase; }
  #join button { margin-top: 14px; padding: 11px; border: 0; border-radius: 6px;
                 font-weight: 700; background: var(--accent); color: #0b1120; }
  #join button:disabled { background: var(--line); color: var(--dim); cursor: not-allowed; }
  /* #join button 쪽 명시도가 더 높아서 #newRoom 단독으로는 안 먹는다. */
  #join #newRoom { margin-top: 8px; background: none; border: 1px solid var(--line);
                   color: var(--dim); font-weight: 400; }
  #join #newRoom:hover { color: var(--fg); border-color: var(--dim); }

  /* ── 화면 1: 로비 ───────────────────────── */
  #lobby { flex: 1; display: flex; min-height: 0; }
  #side { width: 230px; flex: none; padding: 18px 16px; display: flex; flex-direction: column;
          gap: 10px; border-right: 1px solid var(--line); background: #0f172a; }
  #members { list-style: none; display: flex; flex-direction: column; gap: 7px; }
  #members li { display: flex; align-items: center; gap: 8px; }
  #members i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  #members li[data-me] { font-weight: 700; }
  #nick { margin-top: auto; padding: 8px 10px; border: 1px solid var(--line); border-radius: 5px;
          background: var(--panel); color: var(--fg); font: inherit; width: 100%; }

  #picker { flex: 1; overflow-y: auto; padding: 18px; }
  #grid { display: grid; gap: 10px; margin-top: 12px;
          grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
  #grid button { position: relative; padding: 0; min-width: 0; border: 1px solid var(--line);
                 border-radius: 7px; overflow: hidden; background: none; color: inherit; }
  #grid img { display: block; width: 100%; aspect-ratio: 16/9; object-fit: cover;
              opacity: .55; transition: opacity .15s; }
  #grid button:hover { border-color: var(--accent); }
  #grid button:hover img { opacity: 1; }
  #grid span { position: absolute; left: 9px; bottom: 6px; font-weight: 700; font-size: 12px;
               letter-spacing: .05em; text-transform: uppercase;
               text-shadow: 0 1px 5px #000, 0 0 14px #000; }

  /* ── 화면 2: 맵 ─────────────────────────── */
  #board { flex: 1; display: flex; position: relative; min-height: 0; }
  #tools { width: 62px; flex: none; background: var(--panel); border-right: 1px solid var(--line);
           display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0; }
  #tools button { width: 42px; height: 42px; display: grid; place-items: center; font-size: 18px;
                  border: 0; border-radius: 9px; background: none; color: var(--dim); }
  #tools button:hover { background: #0f172a; color: var(--fg); }
  #tools button[aria-current] { background: #0f172a; color: var(--accent);
                                box-shadow: inset 0 0 0 1px var(--accent); }
  #tools hr { width: 26px; border: 0; border-top: 1px solid var(--line); margin: 4px 0; }

  #stage { flex: 1; position: relative; min-width: 0; min-height: 0; overflow: hidden; }
  /* touch-action:none 이 없으면 브라우저가 스크롤/확대로 제스처를 먼저 가져가서
     한 손가락 이동도, 두 손가락 확대도 우리 쪽으로 안 들어온다. */
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
  canvas[data-panning] { cursor: grabbing; }
  #guide { position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
           padding: 6px 14px; border-radius: 99px; background: #0f172ac9; color: var(--dim);
           font-size: 11px; pointer-events: none; backdrop-filter: blur(4px); }
  #guide b { color: var(--fg); font-weight: 600; }
  #zoom { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 4px; }
  #zoom button { width: 30px; height: 30px; border: 1px solid var(--line); border-radius: 5px;
                 background: #0f172ad9; color: var(--dim); }
  #zoom button:hover { color: var(--fg); }
  #zoom span { align-self: center; padding: 0 6px; color: var(--dim); font-size: 11px;
               font-variant-numeric: tabular-nums; }

  /* 오퍼레이터 고르기 */
  #ops { width: 214px; flex: none; background: var(--panel); border-left: 1px solid var(--line);
         display: flex; flex-direction: column; }
  #sides { display: flex; padding: 8px; gap: 6px; }
  #sides button { flex: 1; padding: 6px; border: 1px solid var(--line); border-radius: 5px;
                  background: #0f172a; color: var(--dim); font-weight: 700; font-size: 11px; }
  #sides button[aria-current][data-side=atk] { color: #60a5fa; border-color: #60a5fa; }
  #sides button[aria-current][data-side=def] { color: #fb923c; border-color: #fb923c; }
  /* minmax(0,1fr) 과 min-width:0 이 둘 다 필요하다. 아이콘 svg 는 viewBox 가 350 이라
     고유 너비가 350px 이고, 그리드 항목의 기본 min-width:auto 가 그 아래로 줄어드는 걸
     막아서 4열이 패널 밖으로 밀려나간다. */
  #oplist { flex: 1; overflow-y: auto; display: grid; gap: 4px; padding: 0 8px 8px;
            grid-template-columns: repeat(4, minmax(0, 1fr)); }
  #oplist button { aspect-ratio: 1; display: grid; place-items: center; padding: 3px;
                   min-width: 0; border: 1px solid transparent; border-radius: 6px;
                   background: #0f172a; color: var(--dim); }
  /* 아이콘은 배경판까지 들어간 완성된 그림이다. 색을 덧씌우거나 마스크로 깔면
     주황 액센트가 통째로 사라지므로 <img> 그대로 두고 테두리로만 공/방을 구분한다. */
  #oplist button { opacity: .8; }
  #oplist button:hover { opacity: 1; }
  #oplist button[aria-current] { opacity: 1; border-color: currentColor; }
  #oplist img { display: block; width: 100%; border-radius: 3px; }

  /* 층 바 */
  #bar { position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
         display: flex; flex-direction: column-reverse; gap: 5px; }
  #bar button { width: 40px; height: 36px; border: 1px solid var(--line); border-radius: 7px;
                background: #0f172ad9; color: var(--dim); font-weight: 700; }
  #bar button[aria-current] { background: var(--accent); border-color: var(--accent);
                              color: #0b1120; box-shadow: 0 0 14px #22d3ee66; }
  #hint { position: absolute; right: 12px; bottom: 12px; color: #475569; font-size: 11px;
          font-variant-numeric: tabular-nums; }

  /* ── 모바일 ─────────────────────────────── */
  /* #tools button 쪽 명시도가 더 높아서 #opsToggle 단독으로는 안 숨는다. */
  #tools #opsToggle { display: none; }
  /* 폭 기준만 쓴다. pointer:coarse 를 넣으면 터치 되는 큰 노트북에서도 모바일
     레이아웃이 걸린다. 터치 조작은 레이아웃과 무관하게 어디서든 동작한다. */
  @media (max-width: 820px) {
    header { gap: 8px; padding: 8px 10px; }
    #logo { font-size: 15px; }
    #status { font-size: 10px; }
    #guide, #hint { display: none; }

    /* 로비: 참가자 줄을 위로 눕히고 맵은 작은 카드로 */
    #lobby { flex-direction: column; }
    #side { width: auto; flex-direction: row; align-items: center; flex-wrap: wrap; gap: 12px;
            padding: 10px 12px; border-right: 0; border-bottom: 1px solid var(--line); }
    #side h2:not(:first-of-type) { display: none; }
    #members { flex-direction: row; flex-wrap: wrap; gap: 12px; }
    #nick { margin: 0 0 0 auto; width: 110px; }
    #picker { padding: 12px; }
    #grid { grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 8px; }
    #grid span { font-size: 10px; }

    /* 보드: 도구는 아래 가로 바, 오퍼레이터는 올라오는 서랍 */
    #board { flex-direction: column; }
    #tools { order: 2; width: auto; flex-direction: row; justify-content: center; gap: 10px;
             padding: 6px; border-right: 0; border-top: 1px solid var(--line); }
    #tools button { width: 52px; height: 44px; }
    #tools #opsToggle { display: grid; }
    #ops { position: absolute; inset: auto 0 0 0; width: auto; height: 46vh; z-index: 20;
           border-left: 0; border-top: 1px solid var(--line);
           transform: translateY(101%); transition: transform .18s ease-out; }
    #board[data-ops] #ops { transform: none; }
    #oplist { grid-template-columns: repeat(6, minmax(0, 1fr)); }
    #sides button { padding: 10px; }
    #bar button { width: 44px; height: 42px; }
    #zoom { bottom: 10px; }
    #zoom button { width: 38px; height: 38px; }
  }
</style>

<header>
  <button id="leave" hidden>← 나가기</button>
  <span id="logo">SIXER</span>
  <button id="codeval" hidden title="클릭하면 초대 링크가 복사됩니다"></button>
  <span id="status"></span>
</header>

<div id="join">
  <form id="joinForm">
    <h2>방 입장</h2>
    <label for="joinNick">닉네임</label>
    <input id="joinNick" maxlength="16" placeholder="닉네임" autocomplete="off">
    <label for="joinCode">방 코드</label>
    <input id="joinCode" maxlength="12" placeholder="ABC123" autocomplete="off"
           inputmode="latin" spellcheck="false">
    <button type="submit" id="enter">입장</button>
    <button type="button" id="newRoom">새 방 만들기</button>
  </form>
</div>

<div id="lobby" hidden>
  <aside id="side">
    <h2>참가자</h2>
    <ul id="members"></ul>
    <input id="nick" maxlength="16" placeholder="닉네임" title="닉네임 변경">
  </aside>
  <section id="picker">
    <h2>맵 선택 — 고르면 방 전체가 같이 이동합니다</h2>
    <div id="grid"></div>
  </section>
</div>

<div id="board" hidden>
  <nav id="tools">
    <button data-tool="ping" title="핑 (1) · 3초 뒤 사라짐">◎</button>
    <button data-tool="op" title="오퍼레이터 (2) · 5초 뒤 사라짐">☗</button>
    <button id="opsToggle" title="오퍼레이터 목록">▲</button>
  </nav>
  <div id="stage">
    <canvas id="view"></canvas>
    <div id="guide">
      <b>클릭</b> 마커 · <b>드래그</b> 이동 · <b>휠</b> 층 · <b>Ctrl+휠</b> 확대
    </div>
    <div id="zoom">
      <button data-zoom="-1">−</button><span id="zoomval">100%</span>
      <button data-zoom="1">+</button><button data-zoom="0" title="원래대로">⤢</button>
    </div>
    <div id="bar"></div>
    <div id="hint"></div>
  </div>
  <aside id="ops">
    <div id="sides">
      <button data-side="atk">공격</button><button data-side="def">방어</button>
    </div>
    <div id="oplist"></div>
  </aside>
</div>

<script type="module" src="/src/main.js"></script>
